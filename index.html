<!doctype html>

    <script>
      // Early capture of beforeinstallprompt event before framework loads
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        if (typeof window.dispatchPWAInstallEvent === 'function') {
          window.dispatchPWAInstallEvent(e);
        }
      });

      // Gracefully prevent [vite] websocket connection failure logs in sandboxed iframe environments
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Mock vite-hmr WebSocket so @vite/client never fails or logs errors
        try {
          const OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              const urlStr = typeof url === 'string' ? url : (url && url.href ? url.href : String(url));
              const isViteHmr = protocols === 'vite-hmr' || 
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (urlStr && (urlStr.includes('token=') || urlStr.includes('vite-hmr')));
              
              if (isViteHmr) {
                const target = new EventTarget();
                target.url = urlStr;
                target.readyState = 1; // WebSocket.OPEN
                target.send = function() {};
                target.close = function() { target.readyState = 3; };
                setTimeout(() => {
                  if (typeof target.onopen === 'function') target.onopen(new Event('open'));
                  target.dispatchEvent(new Event('open'));
                }, 0);
                return target;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        // 2. Intercept console logs containing [vite]
        const checkIsVite = function(args) {
          for (let i = 0; i < args.length; i++) {
            const a = args[i];
            const str = typeof a === 'string' ? a : (a && a.message ? a.message : String(a));
            if (/\[vite\]|websocket/i.test(str)) return true;
          }
          return false;
        };

        const originalWarn = console.warn;
        const originalError = console.error;
        const originalInfo = console.info;
        const originalDebug = console.debug;

        console.warn = function(...args) {
          if (checkIsVite(args)) return;
          return originalWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (checkIsVite(args)) return;
          return originalError.apply(console, args);
        };
        if (originalInfo) {
          console.info = function(...args) {
            if (checkIsVite(args)) return;
            return originalInfo.apply(console, args);
          };
        }
        if (originalDebug) {
          console.debug = function(...args) {
            if (checkIsVite(args)) return;
            return originalDebug.apply(console, args);
          };
        }

        // 3. Catch window errors & unhandled promise rejections (Vite websocket & cross-origin iframe security errors)
        const isIgnoredError = function(str) {
          if (!str) return false;
          return /\[vite\]|websocket|Blocked a frame with origin|cross-origin frame|SecurityError.*cross-origin/i.test(str);
        };

        window.addEventListener('error', function(event) {
          const msg = event.message || (event.error && event.error.message) || String(event);
          if (isIgnoredError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = typeof reason === 'string' ? reason : (reason && reason.message) ? reason.message : String(reason);
          if (isIgnoredError(msg) || (reason && reason.type === 'error')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
